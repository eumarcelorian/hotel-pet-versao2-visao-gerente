<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pets | Hotel Pet</title>

    <link rel="stylesheet" href="app.css">
</head>

<body data-secao="pets">
    <div class="painel">
        <aside class="menu-lateral"></aside>

        <div class="conteudo">
            <header class="cabecalho"></header>

            <main>
                <nav class="caminho" aria-label="Caminho da página">
                    <a href="reservas.html">Home</a> /
                    Pets
                </nav>

                <section class="cartao" aria-labelledby="titulo-pets">
                    <h1 id="titulo-pets">Pets</h1>

                    <div class="barra-acoes">
                        <a class="botao botao-contorno botao-pequeno" href="cadastrar-pet.html">+ Novo pet</a>
                    </div>

                    <form class="filtros" action="pets.html" method="get" aria-labelledby="filtros-pets">
                        <h2 class="filtros-titulo" id="filtros-pets">Pesquisar pets</h2>
                        <div class="campo">
                            <label for="id">Id</label>
                            <input type="text" id="id" name="id">
                        </div>
                        <div class="campo">
                            <label for="tipo">Tipo</label>
                            <select id="tipo" name="tipo">
                                <option value="">Todos</option>
                                <option value="cachorro">Cachorro</option>
                                <option value="gato">Gato</option>
                                <option value="outro">Outro</option>
                            </select>
                        </div>
                        <div class="campo">
                            <label for="raca">Raça</label>
                            <input type="text" id="raca" name="raca">
                        </div>
                        <div class="campo">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" name="nome">
                        </div>
                        <div class="campo">
                            <label for="tamanho">Tamanho</label>
                            <select id="tamanho" name="tamanho">
                                <option value="">Todos</option>
                                <option value="pequeno">Pequeno</option>
                                <option value="medio">Médio</option>
                                <option value="grande">Grande</option>
                            </select>
                        </div>
                        <div class="botoes-filtro">
                            <button class="botao" type="submit">Pesquisar</button>
                            <button class="botao botao-contorno" type="reset">Limpar</button>
                        </div>
                    </form>

                    <div class="tabela-responsiva">
                        <table>
                            <thead>
                                <tr>
                                    <th scope="col">Selecionar</th>
                                    <th scope="col">Id</th>
                                    <th scope="col">Nome</th>
                                    <th scope="col">Tipo</th>
                                    <th scope="col">Raça</th>
                                    <th scope="col">Tamanho</th>
                                    <th scope="col">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-pets"></tbody>
                        </table>
                    </div>

                    <p class="mensagem-busca" id="mensagem-busca" role="status" aria-live="polite"></p>
                </section>
            </main>
        </div>
    </div>

    <script src="layout.js"></script>
    <script src="dados.js"></script>
    <script src="pets-lista.js"></script>
    <script src="busca-pets.js"></script>
</body>
</html>

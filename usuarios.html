<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários | Hotel Pet</title>

    <link rel="stylesheet" href="app.css">
</head>

<body data-secao="usuarios">
    <div class="painel">
        <aside class="menu-lateral"></aside>

        <div class="conteudo">
            <header class="cabecalho"></header>

            <main>
                <nav class="caminho" aria-label="Caminho da página">
                    <a href="reservas.html">Home</a> /
                    Usuários
                </nav>

                <section class="cartao" aria-labelledby="titulo-usuarios">
                    <h1 id="titulo-usuarios">Usuários</h1>

                    <div class="barra-acoes">
                        <a class="botao botao-contorno botao-pequeno" href="cadastrar-usuario.html">+ Novo</a>
                        <button class="botao botao-contorno botao-pequeno" id="botao-remover" type="button">Remover</button>
                        <button class="botao botao-contorno botao-pequeno" id="botao-status" type="button">Mudar status</button>
                    </div>

                    <div class="visualizar-por">
                        <span>Visualizar por:</span>
                        <button class="aba" type="button" aria-pressed="true">Usuários</button>
                        <button class="aba" type="button" aria-pressed="false">Função</button>
                    </div>

                    <form class="filtros" action="usuarios.html" method="get" aria-label="Pesquisar usuários">
                        <div class="campo">
                            <label for="id">Id</label>
                            <input type="text" id="id" name="id">
                        </div>
                        <fieldset class="periodo">
                            <legend>Criado em</legend>
                            <div>
                                <label for="data-inicial">De</label>
                                <input type="date" id="data-inicial" name="data-inicial">
                            </div>
                            <div>
                                <label for="data-final">Até</label>
                                <input type="date" id="data-final" name="data-final">
                            </div>
                        </fieldset>
                        <div class="campo">
                            <label for="email">E-mail</label>
                            <input type="text" id="email" name="email" inputmode="email">
                        </div>
                        <div class="campo">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" name="nome">
                        </div>
                        <div class="campo">
                            <label for="status">Status</label>
                            <select id="status" name="status">
                                <option value="">Todos</option>
                                <option value="ativo">Ativo</option>
                                <option value="inativo">Inativo</option>
                            </select>
                        </div>
                        <div class="campo">
                            <label for="funcao">Função</label>
                            <select id="funcao" name="funcao">
                                <option value="">Todas</option>
                                <option value="gerente">Gerente</option>
                                <option value="funcionario">Funcionário</option>
                                <option value="cliente">Cliente</option>
                            </select>
                        </div>
                        <div class="botoes-filtro">
                            <button class="botao" type="submit">Pesquisar</button>
                            <button class="botao botao-contorno" type="reset">Limpar</button>
                        </div>
                    </form>

                    <div class="tabela-responsiva">
                        <table>
                            <thead>
                                <tr>
                                    <th scope="col">Selecionar</th>
                                    <th scope="col">Foto</th>
                                    <th scope="col">Id</th>
                                    <th scope="col">E-mail ↓</th>
                                    <th scope="col">Nome ↓</th>
                                    <th scope="col">Função ↓</th>
                                    <th scope="col">Status ↓</th>
                                    <th scope="col">Criado em ↓</th>
                                    <th scope="col">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-usuarios"></tbody>
                        </table>
                    </div>

                    <p class="mensagem-busca" id="mensagem-busca" role="status" aria-live="polite"></p>
                </section>
            </main>
        </div>
    </div>

    <script src="layout.js"></script>
    <script src="dados.js"></script>
    <script src="usuarios-lista.js"></script>
    <script src="busca-usuarios.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver reserva | Hotel Pet</title>

    <link rel="stylesheet" href="app.css">
</head>

<body data-secao="reservas">
    <div class="painel">
        <aside class="menu-lateral"></aside>

        <div class="conteudo">
            <header class="cabecalho"></header>

            <main>
                <nav class="caminho" aria-label="Caminho da página">
                    <a href="reservas.html">Home</a> /
                    <a href="reservas.html">Reservas</a> /
                    Ver reserva
                </nav>

                <section class="cartao" aria-labelledby="titulo-ver-reserva">
                    <h1 id="titulo-ver-reserva">Ver reserva</h1>

                    <p class="mensagem-busca erro" id="mensagem-pagina" role="alert" hidden></p>

                    <div class="barra-acoes">
                        <a class="botao botao-contorno botao-pequeno" id="botao-editar" href="editar-reserva.html">Editar</a>
                    </div>

                    <dl class="detalhes">
                        <div>
                            <dt>Id:</dt>
                            <dd id="ver-id"></dd>
                        </div>
                        <div>
                            <dt>Proprietário:</dt>
                            <dd id="ver-proprietario"></dd>
                        </div>
                        <div>
                            <dt>Pet:</dt>
                            <dd id="ver-pet"></dd>
                        </div>
                        <div>
                            <dt>Chegada:</dt>
                            <dd id="ver-chegada"></dd>
                        </div>
                        <div>
                            <dt>Partida:</dt>
                            <dd id="ver-partida"></dd>
                        </div>
                        <div>
                            <dt>Notas:</dt>
                            <dd id="ver-notas"></dd>
                        </div>
                        <div>
                            <dt>Anotações dos funcionários:</dt>
                            <dd id="ver-anotacoes"></dd>
                        </div>
                        <div>
                            <dt>Imagens:</dt>
                            <dd id="ver-imagens"></dd>
                        </div>
                        <div>
                            <dt>Status:</dt>
                            <dd id="ver-status"></dd>
                        </div>
                        <div>
                            <dt>Total das diárias:</dt>
                            <dd id="ver-total"></dd>
                        </div>
                        <div>
                            <dt>Recibo:</dt>
                            <dd id="ver-recibo"></dd>
                        </div>
                        <div>
                            <dt>Criada em:</dt>
                            <dd id="ver-criada"></dd>
                        </div>
                        <div>
                            <dt>Atualizada em:</dt>
                            <dd id="ver-atualizada"></dd>
                        </div>
                    </dl>

                    <p class="voltar">
                        <a class="botao botao-contorno botao-pequeno" href="reservas.html">← Voltar</a>
                    </p>
                </section>
            </main>
        </div>
    </div>

    <script src="layout.js"></script>
    <script src="dados.js"></script>
    <script src="ver-reserva.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar pet | Hotel Pet</title>

    <link rel="stylesheet" href="app.css">
</head>

<body data-secao="pets">
    <div class="painel">
        <aside class="menu-lateral"></aside>

        <div class="conteudo">
            <header class="cabecalho"></header>

            <main>
                <nav class="caminho" aria-label="Caminho da página">
                    <a href="reservas.html">Home</a> /
                    <a href="pets.html">Pets</a> /
                    Ver pet
                </nav>

                <section class="cartao" aria-labelledby="titulo-ver-pet">
                    <h1 id="titulo-ver-pet">Ver pet</h1>

                    <p class="mensagem-busca erro" id="mensagem-pagina" role="alert" hidden></p>

                    <div class="barra-acoes">
                        <a class="botao botao-contorno botao-pequeno" id="botao-editar" href="editar-pet.html">Editar</a>
                        <button class="botao botao-contorno botao-pequeno" id="botao-deletar" type="button">Deletar</button>
                    </div>

                    <dl class="detalhes">
                        <div>
                            <dt>Proprietário:</dt>
                            <dd id="ver-proprietario"></dd>
                        </div>
                        <div>
                            <dt>Id:</dt>
                            <dd id="ver-id"></dd>
                        </div>
                        <div>
                            <dt>Nome:</dt>
                            <dd id="ver-nome"></dd>
                        </div>
                        <div>
                            <dt>Tipo:</dt>
                            <dd id="ver-tipo"></dd>
                        </div>
                        <div>
                            <dt>Raça:</dt>
                            <dd id="ver-raca"></dd>
                        </div>
                        <div>
                            <dt>Tamanho:</dt>
                            <dd id="ver-tamanho"></dd>
                        </div>
                        <div>
                            <dt>Imagem:</dt>
                            <dd id="ver-imagem"></dd>
                        </div>
                    </dl>

                    <section class="historico" aria-labelledby="titulo-historico">
                        <h2 id="titulo-historico">Reservas</h2>
                        <ul id="lista-reservas"></ul>
                    </section>

                    <p class="voltar">
                        <a class="botao botao-contorno botao-pequeno" href="pets.html">← Voltar</a>
                    </p>
                </section>
            </main>
        </div>
    </div>

    <script src="layout.js"></script>
    <script src="dados.js"></script>
    <script src="visualizar-pet.js"></script>
</body>
</html>

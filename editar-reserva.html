<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar reserva | Hotel Pet</title>

    <link rel="stylesheet" href="app.css">
</head>

<body data-secao="reservas">
    <div class="painel">
        <aside class="menu-lateral"></aside>

        <div class="conteudo">
            <header class="cabecalho"></header>

            <main>
                <nav class="caminho" aria-label="Caminho da página">
                    <a href="reservas.html">Home</a> /
                    <a href="reservas.html">Reservas</a> /
                    Editar reserva
                </nav>

                <section class="cartao cartao-formulario" aria-labelledby="titulo-editar">
                    <h1 id="titulo-editar">Editar reserva</h1>

                    <form action="reservas.html" method="get">
                        <div class="campo">
                            <label for="proprietario">Proprietário *</label>
                            <input type="text" id="proprietario" name="proprietario" value="José da Silva" required>
                        </div>
                        <div class="campo">
                            <label for="pet">Pet *</label>
                            <input type="text" id="pet" name="pet" value="Max" required>
                        </div>
                        <fieldset class="periodo">
                            <legend>Período *</legend>
                            <div>
                                <label for="data-entrada">Data de entrada</label>
                                <input type="date" id="data-entrada" name="data-entrada" value="2021-05-02" required>
                            </div>
                            <div>
                                <label for="data-saida">Data de saída</label>
                                <input type="date" id="data-saida" name="data-saida" value="2021-05-07" required>
                            </div>
                        </fieldset>
                        <div class="campo">
                            <label for="notas">Notas</label>
                            <textarea id="notas" name="notas" rows="4">Informações sobre a estadia do pet.</textarea>
                        </div>
                        <div class="campo">
                            <label for="status">Status *</label>
                            <select id="status" name="status" required>
                                <option value="reservada" selected>Reservada</option>
                                <option value="andamento">Em andamento</option>
                                <option value="finalizada">Finalizada</option>
                            </select>
                        </div>
                        <p class="total">
                            Total das diárias:
                            <strong>R$ 40,00</strong>
                        </p>
                        <div class="acoes">
                            <button class="botao" type="submit">Salvar</button>
                            <button class="botao botao-contorno" type="reset">Limpar</button>
                        </div>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <script src="layout.js"></script>
</body>
</html>

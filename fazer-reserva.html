<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer reserva | Hotel Pet</title>

    <link rel="stylesheet" href="app.css">
</head>

<body data-secao="reservas">
    <div class="painel">
        <aside class="menu-lateral"></aside>

        <div class="conteudo">
            <header class="cabecalho"></header>

            <main>
                <nav class="caminho" aria-label="Caminho da página">
                    <a href="reservas.html">Home</a> /
                    <a href="reservas.html">Reservas</a> /
                    Nova reserva
                </nav>

                <section class="cartao cartao-formulario" aria-labelledby="titulo-fazer-reserva">
                    <h1 id="titulo-fazer-reserva">Fazer reserva</h1>

                    <form id="formulario-reserva" action="reservas.html" method="get">
                        <div class="campo">
                            <label for="pet">Pet *</label>
                            <select id="pet" name="pet" required>
                                <option value="">Selecione um pet</option>
                                                        </select>
                        </div>
                        <fieldset class="periodo">
                            <legend>Período *</legend>
                            <div>
                                <label for="data-entrada">Data de entrada</label>
                                <input type="date" id="data-entrada" name="data-entrada" required>
                            </div>
                            <div>
                                <label for="data-saida">Data de saída</label>
                                <input type="date" id="data-saida" name="data-saida" required>
                            </div>
                        </fieldset>
                        <div class="campo">
                            <label for="notas">Notas</label>
                            <textarea id="notas" name="notas" rows="5" placeholder="Digite informações importantes sobre o pet."></textarea>
                        </div>
                        <p class="mensagem-busca erro" id="mensagem-pagina" role="alert" hidden></p>
                        <p class="total">
                            Total das diárias:
                            <strong id="total-diarias">R$ 0,00</strong>
                        </p>
                        <div class="acoes">
                            <button class="botao" type="submit">Salvar</button>
                            <button class="botao botao-contorno" type="reset">Limpar</button>
                        </div>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <script src="layout.js"></script>
    <script src="dados.js"></script>
    <script src="fazer-reserva.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar usuário | Hotel Pet</title>

    <link rel="stylesheet" href="app.css">
</head>

<body data-secao="usuarios">
    <div class="painel">
        <aside class="menu-lateral"></aside>

        <div class="conteudo">
            <header class="cabecalho"></header>

            <main>
                <nav class="caminho" aria-label="Caminho da página">
                    <a href="reservas.html">Home</a> /
                    <a href="usuarios.html">Usuários</a> /
                    Novo usuário
                </nav>

                <section class="cartao cartao-formulario" aria-labelledby="titulo-cadastro">
                    <h1 id="titulo-cadastro">Cadastrar usuário</h1>

                    <form action="usuarios.html" method="get">
                        <div class="campo">
                            <label for="email">E-mail *</label>
                            <input type="email" id="email" name="email" placeholder="Digite o e-mail" required>
                        </div>
                        <div class="campo">
                            <label for="nome">Nome *</label>
                            <input type="text" id="nome" name="nome" placeholder="Digite o nome" required>
                        </div>
                        <div class="campo">
                            <label for="sobrenome">Sobrenome</label>
                            <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite o sobrenome">
                        </div>
                        <div class="campo">
                            <label for="telefone">Telefone *</label>
                            <input type="tel" id="telefone" name="telefone" placeholder="+55 (00) 00000-0000" required>
                        </div>
                        <div class="campo">
                            <label for="funcao">Função *</label>
                            <select id="funcao" name="funcao" required>
                                <option value="">Selecione uma função</option>
                                <option value="cliente">Cliente</option>
                                <option value="funcionario">Funcionário</option>
                                <option value="gerente">Gerente</option>
                            </select>
                        </div>
                        <div class="campo">
                            <label for="foto">Foto</label>
                            <input type="file" id="foto" name="foto" accept="image/*">
                        </div>
                        <div class="acoes">
                            <button class="botao" type="submit">Salvar</button>
                            <button class="botao botao-contorno" type="reset">Limpar</button>
                        </div>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <script src="layout.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações | Hotel Pet</title>

    <link rel="stylesheet" href="app.css">
</head>

<body data-secao="configuracoes">
    <div class="painel">
        <aside class="menu-lateral"></aside>

        <div class="conteudo">
            <header class="cabecalho"></header>

            <main>
                <nav class="caminho" aria-label="Caminho da página">
                    <a href="reservas.html">Home</a> /
                    Configurações
                </nav>

                <section class="cartao cartao-formulario" aria-labelledby="titulo-configuracoes">
                    <h1 id="titulo-configuracoes">Configurações</h1>

                    <form action="configuracoes.html" method="get">
                        <div class="campo">
                            <label for="valor-diaria">Valor da diária</label>
                            <input type="text" id="valor-diaria" name="valor-diaria" value="R$ 10,00" inputmode="decimal" required>
                        </div>
                        <div class="campo">
                            <label for="vagas">Vagas disponíveis</label>
                            <input type="number" id="vagas" name="vagas" value="3" min="0" required>
                        </div>
                        <div class="acoes">
                            <button class="botao" type="submit">Salvar</button>
                            <button class="botao botao-contorno" type="reset">Limpar</button>
                        </div>
                    </form>
                </section>
            </main>
        </div>
    </div>

    <script src="layout.js"></script>
</body>
</html>
